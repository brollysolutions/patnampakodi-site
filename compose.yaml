# Local development only: loopback ports and disposable example credentials.
name: pakodi-mvp
services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: pakodi_owner
      POSTGRES_PASSWORD: local-owner-only
      POSTGRES_DB: pakodi
    ports:
      - "127.0.0.1:54339:5432"
    volumes:
      - pakodi_postgres:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakodi_owner -d pakodi"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    ports:
      - "127.0.0.1:63799:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - pakodi_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pakodi_redis:
  pakodi_postgres:

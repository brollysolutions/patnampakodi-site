name: Workflow verification

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure clone-local hooks
        run: git config --local core.hooksPath .githooks
      - name: Run applicable verification
        run: python scripts/verify_workflow.py workflow-only
      - name: Require living records for product changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: python scripts/check_feature_tracking.py --base-ref "$BASE_SHA"

  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned package tooling
        run: python -m pip install uv==0.12.10
      - name: Start isolated PostgreSQL fixture
        run: docker compose up -d --wait postgres redis
      - name: Install browser and system libraries
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify API, migrations, contracts, web, accessibility, SEO and performance
        env:
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
        run: python scripts/verify_application.py all ci

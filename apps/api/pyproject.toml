[project]
name = "pakodi-content-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "psycopg[binary]==3.3.5",
  "alembic==1.19.2",
  "httpx==0.28.1",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
  "redis==8.1.0",
  "APScheduler==3.11.3",
  "pillow==12.3.0",
  "reportlab==5.0.1",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.6", "pip-audit==2.10.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

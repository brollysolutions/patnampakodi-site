# Local review only. Fixed synthetic infrastructure credentials; no real vendors.
name: pakodi-stage
x-runtime: &runtime
  APP_ENV: staging
  PROVIDER_MODE: fixtures
  PUBLIC_ORIGIN: http://127.0.0.1:3500
  DATABASE_URL: postgresql://pakodi_reader:local-reader-only@postgres:5432/pakodi
  COMMERCE_DATABASE_URL: postgresql://pakodi_app:local-app-only@postgres:5432/pakodi
  REDIS_URL: redis://redis:6379/0
  RAZORPAY_KEY_ID: rzp_test_local_fixture
  RAZORPAY_WEBHOOK_SECRET: local-fixture-webhook-only
  META_APP_SECRET: local-fixture-webhook-only
  META_PHONE_ID: fixture_phone
  BROCHURE_PATH: /media/brochure.pdf
services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: pakodi_owner
      POSTGRES_PASSWORD: local-owner-only
      POSTGRES_DB: pakodi
    volumes:
      - postgres:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pakodi_owner -d pakodi]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [private]
  redis:
    image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [private]
  api:
    image: pakodi-stage-api:local
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *runtime
    volumes: [media:/media]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8500/health',timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [private]
  fixture-provider:
    image: pakodi-stage-api:local
    command: [python, -m, uvicorn, app.fixture_provider:app, --host, 0.0.0.0, --port, '8500', --no-access-log]
    environment:
      <<: *runtime
      FIXTURE_STORE: /media/provider.sqlite3
    volumes: [provider:/media]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8500/health',headers={'Authorization':'Basic Zml4dHVyZTpsb2NhbC1maXh0dXJlLW9ubHk='}),timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [private]
  worker:
    image: pakodi-stage-api:local
    command: [python, -m, app.jobs]
    environment: *runtime
    volumes: [media:/media]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: {condition: service_healthy}
      fixture-provider: {condition: service_healthy}
    networks: [private]
  web:
    image: pakodi-stage-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: {SITE_INDEXABLE: 'false', DEPLOYMENT_ENV: preview}
    environment:
      CONTENT_API_URL: http://api:8500
      SITE_INDEXABLE: 'false'
      DEPLOYMENT_ENV: preview
    ports: ['127.0.0.1:3500:3500']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3500/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks: [private, web-entry]
  migrate:
    image: pakodi-stage-api:local
    profiles: [operations]
    environment:
      <<: *runtime
      MIGRATION_DATABASE_URL: postgresql://pakodi_owner:local-owner-only@postgres:5432/pakodi
    command: [python, -m, alembic, upgrade, head]
    networks: [private]
  seed:
    image: pakodi-stage-api:local
    profiles: [operations]
    environment:
      <<: *runtime
      MIGRATION_DATABASE_URL: postgresql://pakodi_owner:local-owner-only@postgres:5432/pakodi
    command: [python, -m, app.seed, --published-only]
    networks: [private]
networks:
  private: {internal: true}
  web-entry: {}
volumes:
  postgres:
  redis:
  media:
  provider:
